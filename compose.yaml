name: gapsi

services:
  api:
    build: .
    image: gapsi-api:local
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: sqlite:///app/data/db.sqlite3
      GENERATE_SCHEMAS: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - sqlite-data:/app/data

volumes:
  sqlite-data:
