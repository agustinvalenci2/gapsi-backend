substitutions:
  _REGION: europe-west1
  _SERVICE: gapsi-backend
  _REPOSITORY: cloud-run-source-deploy

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        if ! gcloud artifacts repositories describe "${_REPOSITORY}" --location "${_REGION}" >/dev/null 2>&1; then
          gcloud artifacts repositories create "${_REPOSITORY}" \
            --repository-format=docker \
            --location "${_REGION}" \
            --description="GAPSI Docker images"
        fi

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"
      - --command=
      - --args=
      - --remove-secrets
      - DATABASE_URL,JWT_SECRET_KEY
      - --clear-cloudsql-instances
      - --remove-env-vars
      - PGHOST,PGPORT,PGUSER,PGPASSWORD,PGDATABASE,JWT_SECRET_KEY
      - --update-env-vars
      - DATABASE_URL=sqlite:///app/data/db.sqlite3,GAPSI_DEBUG=false,GENERATE_SCHEMAS=true
      - --max
      - "1"
      - --max-instances
      - "1"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
